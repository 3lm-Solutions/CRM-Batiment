# pnpm 10+ / 11 / 12 : paquets autorisés à exécuter leur script d'installation
# (pnpm 12 ne lit plus « pnpm.onlyBuiltDependencies » du package.json)
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: true
